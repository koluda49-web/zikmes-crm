<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зикмес Mini CRM — Вход</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1f2e;
    color: #c8d0e7;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: #252b3d;
    border: 1px solid #2d3550;
    border-radius: 16px;
    padding: 36px 40px;
    width: 340px;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: #e8eaf6;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 28px;
  }
  input[type="password"] {
    width: 100%;
    background: #0f1420;
    border: 1px solid #2d3550;
    border-radius: 8px;
    color: #e8eaf6;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    margin-bottom: 14px;
    transition: border-color .15s;
  }
  input[type="password"]:focus { border-color: #6366f1; }
  button {
    width: 100%;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  .error {
    background: #3b1919;
    border: 1px solid #ef4444;
    border-radius: 8px;
    color: #ef4444;
    font-size: 12px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>⚡ Зикмес Mini CRM</h1>
  <p class="subtitle">Введите пароль для доступа</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="Пароль" autofocus autocomplete="current-password">
    <button type="submit">Войти</button>
  </form>
</div>
</body>
</html>
