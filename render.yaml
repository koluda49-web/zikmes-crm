services:
  - type: web
    name: zikmes-crm
    env: python
    region: frankfurt
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 3600
    envVars:
      - key: CRM_ORDERS_URL
        value: https://a.ok-crm.com/order/index
      - key: OVERDUE_DAYS
        value: "7"
      - key: PAID_STATUSES
        value: "Погашен,Оплачен,Неактивный"
      - key: ROUTE_DATE_DAYS_BACK
        value: "300"
      # Playwright ищет браузеры по этому пути (установлены в build.sh)
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.pw-browsers
      # Секреты — заполнить вручную в Render Dashboard после деплоя:
      - key: SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_SHEET_WEBHOOK
        sync: false
      - key: DEBTOR_REGISTRY_WEBHOOK
        sync: false
      - key: DEBTOR_REGISTRY_SECRET
        sync: false
      - key: MTS_LOGIN
        sync: false
      - key: MTS_PASSWORD
        sync: false
      - key: SALARY_REPORT_SCRIPT_URL
        sync: false
      - key: CRM_STORAGE_STATE
        sync: false
      # OKCRM_STORAGE_STATE: не задавать если используется кнопка "Загрузить сессию" в дашборде.
      # При заданной переменной config.py игнорирует загруженный storage_state.json.
      # Задать только если сессия передаётся через env var (base64 от export_crm_session.py).
      - key: OKCRM_STORAGE_STATE
        sync: false
