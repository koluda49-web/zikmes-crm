[build]
  functions = "netlify/functions"
  publish   = "."
  command   = "cp app.py netlify/functions/app/flask_app.py && mkdir -p netlify/functions/app/templates && cp templates/dashboard.html netlify/functions/app/templates/"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app"
  status = 200
