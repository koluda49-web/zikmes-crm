[build]
  functions = "netlify/functions"
  publish   = "."
  command   = "pip install flask serverless-wsgi requests --target netlify/functions/_packages && cp app.py netlify/functions/flask_app.py && mkdir -p netlify/functions/templates && cp templates/dashboard.html netlify/functions/templates/"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app"
  status = 200
